[project]
name = "pii-masking-filter"
version = "0.1.0"
description = "Presidio-based Japanese PII masking REST API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "presidio-analyzer>=2.2.354",
    "spacy>=3.8.0,<3.9",
    "pydantic>=2.7.0",
    "python-dotenv>=1.2.1",
    "ja-core-news-lg @ https://github.com/explosion/spacy-models/releases/download/ja_core_news_lg-3.8.0/ja_core_news_lg-3.8.0-py3-none-any.whl",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false
